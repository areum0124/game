<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나만의 테트리스 게임</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1a1a1a;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      display: flex;
      gap: 20px;
      background-color: #2a2a2a;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .game-board-container {
      position: relative;
    }

    #tetris {
      border: 3px solid #444;
      background-color: #000;
      display: block;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 150px;
    }

    .info-box {
      background-color: #333;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      text-align: center;
    }

    .info-box h2 {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    .info-box p {
      font-size: 24px;
      font-weight: bold;
      color: #00ffcc;
    }

    .controls-info {
      background-color: #333;
      padding: 15px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.6;
      color: #ccc;
    }

    .controls-info h3 {
      color: #fff;
      margin-bottom: 8px;
    }

    #start-btn {
      background-color: #00ffcc;
      color: #000;
      border: none;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.2s;
      width: 100%;
    }

    #start-btn:hover {
      background-color: #00cca3;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="game-board-container">
      <canvas id="tetris" width="240" height="400"></canvas>
    </div>

    <div class="sidebar">
      <div>
        <div class="info-box">
          <h2>점수</h2>
          <p id="score">0</p>
        </div>
        <div class="info-box">
          <h2>레벨</h2>
          <p id="level">1</p>
        </div>
        <div class="info-box">
          <h2>지운 줄 수</h2>
          <p id="lines">0</p>
        </div>
      </div>

      <div class="controls-info">
        <h3>조작 방법</h3>
        <p>← / → : 좌우 이동</p>
        <p>↓ : 빠르게 내리기</p>
        <p>↑ : 회전</p>
        <p>스페이스바 : 즉시 떨어뜨리기</p>
      </div>

      <button id="start-btn">게임 시작 / 재시작</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    const levelElement = document.getElementById('level');
    const linesElement = document.getElementById('lines');
    const startBtn = document.getElementById('start-btn');

    // 블록 크기 확대 (240x400 Canvas 기준 12행 20열 => 20px 단위)
    context.scale(20, 20);

    // 테트리스 블록 색상 설정
    const colors = [
      null,
      '#FF0D72', // T
      '#0DC2FF', // I
      '#0DFF72', // S
      '#F538FF', // Z
      '#FF8E0D', // L
      '#FFE138', // J
      '#3877FF'  // O
    ];

    // 블록 모양 생성 함수
    function createPiece(type) {
      if (type === 'I') {
        return [
          [0, 1, 0, 0],
          [0, 1, 0, 0],
          [0, 1, 0, 0],
          [0, 1, 0, 0],
        ];
      } else if (type === 'L') {
        return [
          [0, 2, 0],
          [0, 2, 0],
          [0, 2, 2],
        ];
      } else if (type === 'J') {
        return [
          [0, 3, 0],
          [0, 3, 0],
          [3, 3, 0],
        ];
      } else if (type === 'O') {
        return [
          [4, 4],
          [4, 4],
        ];
      } else if (type === 'Z') {
        return [
          [5, 5, 0],
          [0, 5, 5],
          [0, 0, 0],
        ];
      } else if (type === 'S') {
        return [
          [0, 6, 6],
          [6, 6, 0],
          [0, 0, 0],
        ];
      } else if (type === 'T') {
        return [
          [0, 7, 0],
          [7, 7, 7],
          [0, 0, 0],
        ];
      }
    }

    // 12 x 20 크기의 게임 판 생성
    function createMatrix(w, h) {
      const matrix = [];
      while (h--) {
        matrix.push(new Array(w).fill(0));
      }
      return matrix;
    }

    let arena = createMatrix(12, 20);

    const player = {
      pos: {x: 0, y: 0},
      matrix: null,
      score: 0,
      lines: 0,
      level: 1,
    };

    // 충돌 검사
    function collide(arena, player) {
      const m = player.matrix;
      const o = player.pos;
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] !== 0 &&
             (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    // 쌓인 블록 판에 병합
    function merge(arena, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            arena[y + player.pos.y][x + player.pos.x] = value;
          }
        });
      });
    }

    // 완성된 줄 삭제 및 점수 계산
    function arenaSweep() {
      let rowCount = 1;
      let clearedLines = 0;

      outer: for (let y = arena.length - 1; y > 0; --y) {
        for (let x = 0; x < arena[y].length; ++x) {
          if (arena[y][x] === 0) {
            continue outer;
          }
        }

        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        ++y;

        player.score += rowCount * 10;
        rowCount *= 2;
        clearedLines++;
      }

      if (clearedLines > 0) {
        player.lines += clearedLines;
        player.level = Math.floor(player.lines / 10) + 1;
        dropInterval = Math.max(100, 1000 - (player.level - 1) * 100); // 레벨 상승 시 속도 증가
      }
    }

    // 화면 그리기
    function draw() {
      context.fillStyle = '#000';
      context.fillRect(0, 0, canvas.width, canvas.height);

      drawMatrix(arena, {x: 0, y: 0});
      drawMatrix(player.matrix, player.pos);
    }

    // 매트릭스(블록 및 바닥) 그리기
    function drawMatrix(matrix, offset) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            context.fillStyle = colors[value];
            context.fillRect(x + offset.x, y + offset.y, 1, 1);
            
            // 테두리 선 추가로 블록 구분을 명확히 표현
            context.strokeStyle = '#222';
            context.lineWidth = 0.05;
            context.strokeRect(x + offset.x, y + offset.y, 1, 1);
          }
        });
      });
    }

    // 블록 회전
    function rotate(matrix, dir) {
      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
          [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
      }
      if (dir > 0) {
        matrix.forEach(row => row.reverse());
      } else {
        matrix.reverse();
      }
    }

    // 블록 이동
    function playerMove(offset) {
      player.pos.x += offset;
      if (collide(arena, player)) {
        player.pos.x -= offset;
      }
    }

    // 새로운 랜덤 블록 생성
    function playerReset() {
      const pieces = 'TJLOSZI';
      player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
      player.pos.y = 0;
      player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

      // 게임 오버 체크
      if (collide(arena, player)) {
        alert("게임 오버! 점수: " + player.score);
        arena.forEach(row => row.fill(0));
        player.score = 0;
        player.lines = 0;
        player.level = 1;
        dropInterval = 1000;
        updateScore();
      }
    }

    // 블록 떨어뜨리기 (하향)
    function playerDrop() {
      player.pos.y++;
      if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
        updateScore();
      }
      dropCounter = 0;
    }

    // 하드 드롭 (스페이스바 입력 시 바닥까지 한번에)
    function playerHardDrop() {
      while (!collide(arena, player)) {
        player.pos.y++;
      }
      player.pos.y--;
      merge(arena, player);
      playerReset();
      arenaSweep();
      updateScore();
      dropCounter = 0;
    }

    // 회전 처리 및 벽 충돌 방지
    function playerRotate(dir) {
      const pos = player.pos.x;
      let offset = 1;
      rotate(player.matrix, dir);
      while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
          rotate(player.matrix, -dir);
          player.pos.x = pos;
          return;
        }
      }
    }

    // 점수 및 상태 업데이트
    function updateScore() {
      scoreElement.innerText = player.score;
      levelElement.innerText = player.level;
      linesElement.innerText = player.lines;
    }

    let dropCounter = 0;
    let dropInterval = 1000; // 초기 떨어지는 속도 (1초)
    let lastTime = 0;
    let isRunning = false;

    // 게임 루프
    function update(time = 0) {
      if (!isRunning) return;

      const deltaTime = time - lastTime;
      lastTime = time;

      dropCounter += deltaTime;
      if (dropCounter > dropInterval) {
        playerDrop();
      }

      draw();
      requestAnimationFrame(update);
    }

    // 키보드 조작 이벤트
    document.addEventListener('keydown', event => {
      if (!isRunning) return;

      if (event.keyCode === 37) { // 왼쪽 화살표
        playerMove(-1);
      } else if (event.keyCode === 39) { // 오른쪽 화살표
        playerMove(1);
      } else if (event.keyCode === 40) { // 아래쪽 화살표
        playerDrop();
      } else if (event.keyCode === 38) { // 위쪽 화살표 (회전)
        playerRotate(1);
      } else if (event.keyCode === 32) { // 스페이스바 (하드 드롭)
        event.preventDefault(); // 스크롤 방지
        playerHardDrop();
      }
    });

    // 시작 / 재시작 버튼 이벤트
    startBtn.addEventListener('click', () => {
      arena.forEach(row => row.fill(0));
      player.score = 0;
      player.lines = 0;
      player.level = 1;
      dropInterval = 1000;
      updateScore();
      playerReset();
      
      if (!isRunning) {
        isRunning = true;
        update();
      }
    });
  </script>
</body>
</html>
